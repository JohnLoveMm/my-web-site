<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>我的个人资源站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:system-ui;
  background:#0b101f;
  color:#fff;
}
#particles{
  position:fixed;
  width:100%;
  height:100%;
  z-index:0;
}
.container{
  position:relative;
  z-index:2;
  max-width:1100px;
  margin:0 auto;
  padding:40px 20px;
}
h1{
  text-align:center;
  font-size:42px;
  background:linear-gradient(90deg,#38bdf8,#a855f7);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:10px;
}
.desc{
  text-align:center;
  opacity:0.8;
  margin-bottom:40px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}
.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:24px;
  backdrop-filter:blur(10px);
  transition:0.3s ease;
}
.card:hover{
  transform:translateY(-6px);
  border-color:#a855f7;
  box-shadow:0 10px 30px #a855f733;
}
.card h3{margin-bottom:10px;}
.card p{opacity:0.7;font-size:14px;}
a{
  color:#93c5fd;
  text-decoration:none;
}
.video-wrap{
  width:100%;
  border-radius:12px;
  overflow:hidden;
  margin:10px 0;
}
video{width:100%;}
</style>
</head>
<body>
<div id="particles"></div>
<div class="container">
  <h1>我的个人资源网站</h1>
  <p class="desc">文档 | 图片 | 视频 | 资源下载</p>

  <div class="grid">

    <!-- 文档卡片示例 -->
    <div class="card">
      <h3>📄 技术文档</h3>
      <p>学习笔记、工作备忘、技术总结</p>
      <p><a href="docs.html">点击进入</a></p>
    </div>

    <!-- 图片展示卡片 -->
    <div class="card">
      <h3>🖼️ 图片素材</h3>
      <p>截图、效果图、素材集合</p>
      <p><a href="images.html">点击查看</a></p>
    </div>

    <!-- 视频卡片 -->
    <div class="card">
      <h3>🎬 视频演示</h3>
      <p>教程视频、演示视频</p>
      <div class="video-wrap">
        <video controls muted>
          <source src="video/demo.mp4">
        </video>
      </div>
    </div>

    <!-- 资源下载卡片 -->
    <div class="card">
      <h3>📦 压缩包资源</h3>
      <p>代码、工具、数据集压缩包</p>
      <p><a href="files/resource.zip" download>点击下载压缩包</a></p>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
particlesJS("particles",{
  particles:{
    number:{value:90},
    color:{value:"#60a5fa"},
    opacity:{value:0.2},
    size:{value:2.5},
    line_linked:{enable:true,color:"#60a5fa",opacity:0.1,distance:140},
    move:{enable:true,speed:1.2}
  },
  interactivity:{
    events:{onhover:{enable:true,mode:"grab"}}
  }
})
</script>
</body>
</html>
